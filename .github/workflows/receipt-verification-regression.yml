name: Receipt verification regression tests

on:
  push:
    branches:
      - fix/receipt-verification-source-truth-20261014
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check regression test syntax
        run: node --check test-receipt-verification-rules.cjs
      - name: Run receipt verification regressions
        run: node test-receipt-verification-rules.cjs
