name: Sync operations candidate contract

on:
  push:
    branches:
      - fix/sync-operations-auth-cors-idempotency-20261013
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check contract test syntax
        run: node --check test-contract.cjs
      - name: Run candidate contract invariants
        run: node test-contract.cjs
