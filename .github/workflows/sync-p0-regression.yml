name: Sync P0 regression tests

on:
  push:
    branches:
      - fix/sync-p0-ack-and-durability-20261013
      - fix/sync-fallback-full-snapshot-20261013
  pull_request:
    branches:
      - main
      - fix/sync-p0-ack-and-durability-20261013
      - fix/sync-fallback-full-snapshot-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check regression test syntax
        run: node --check test-sync-p0-client-rules.cjs
      - name: Run sync P0 regression tests
        run: node test-sync-p0-client-rules.cjs
      - name: Parse all inline JavaScript blocks
        run: node test-inline-script-syntax.cjs
      - name: Run async runtime-error containment regressions
        run: node test-security-async-containment.cjs
      - name: Run service-worker cache-failure regressions
        run: node test-sw-guard.cjs
      - name: Run async entrypoint failure regressions
        run: node test-async-entrypoint-containment.cjs

  supabase-local-synthetic-roundtrip:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mount isolated QA fixture
        run: |
          mkdir -p supabase
          cp -R qa/supabase/. supabase/
          printf 'ALLOWED_ORIGINS=https://sintergiase-lgtm.github.io\nLOCAL_QA_DIAGNOSTICS=1\n' > supabase/functions/.env
      - name: Start disposable local Supabase stack
        run: npx --yes supabase@latest start
      - name: Apply synthetic local schema
        run: npx --yes supabase@latest db reset
      - name: Connect function runtime to disposable database
        run: |
          db_container=$(docker ps --format '{{.Names}}' | grep -E '^supabase_db_' | head -n 1)
          if [ -z "$db_container" ]; then docker ps --format '{{.Names}}'; exit 1; fi
          db_ip=$(docker inspect "$db_container" | jq -r '.[0].NetworkSettings.Networks | to_entries[0].value.IPAddress')
          test -n "$db_ip"
          sed -i "s/__LOCAL_QA_DB_HOST__/${db_ip}/g" supabase/functions/realtime-snapshot/index.ts
          grep -Fq "const LOCAL_QA_DB_HOST='${db_ip}'" supabase/functions/realtime-snapshot/index.ts
          printf '%s\n' "ALLOWED_ORIGINS=https://sintergiase-lgtm.github.io" "LOCAL_QA_DIAGNOSTICS=1" > supabase/functions/.env
      - name: Serve the real snapshot function locally
        run: |
          npx --yes supabase@latest functions serve realtime-snapshot --env-file supabase/functions/.env > "$RUNNER_TEMP/realtime-snapshot.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/realtime-snapshot.pid"
          for attempt in $(seq 1 60); do
            code=$(curl --silent --max-time 2 --output /dev/null --write-out '%{http_code}' http://127.0.0.1:54321/functions/v1/realtime-snapshot || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/realtime-snapshot.log"
          exit 1
      - name: Run authenticated two-device synthetic round-trip
        run: node test-local-snapshot-roundtrip.cjs
      - name: Report safe local function errors on failure
        if: failure()
        run: grep -E 'realtime_snapshot_auth_unavailable|realtime_snapshot_error' "$RUNNER_TEMP/realtime-snapshot.log" || true
      - name: Stop disposable local Supabase stack
        if: always()
        run: npx --yes supabase@latest stop --no-backup || true
