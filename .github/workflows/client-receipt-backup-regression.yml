name: Client receipt and backup regression tests

on:
  push:
    branches:
      - fix/client-receipt-backup-20261014
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check receipt-state regression syntax
        run: node --check test-client-receipt-state.cjs
      - name: Run receipt-state regressions
        run: node test-client-receipt-state.cjs
      - name: Check encrypted-backup regression syntax
        run: node --check test-encrypted-backup-merge.cjs
      - name: Run encrypted-backup regressions
        run: node test-encrypted-backup-merge.cjs
