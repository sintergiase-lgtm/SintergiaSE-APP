name: Sync operations candidate regression tests

on:
  push:
    branches:
      - fix/portable-sync-test-20261013
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check regression test syntax
        run: node --check test-sync-operations-rules.cjs
      - name: Run sync operations candidate regressions
        run: node test-sync-operations-rules.cjs
